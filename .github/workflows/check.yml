name: Check extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/prepare-release.cjs --verify-only
      - run: npm run check

  browser-ui:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/.browser-test/node_modules/playwright
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix .browser-test --no-save --package-lock=false playwright@1.62.1
      - run: .browser-test/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:ui
